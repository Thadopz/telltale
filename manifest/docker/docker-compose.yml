services:
  telltale:
    image: telltale-standalone:local
    container_name: telltale-standalone
    ports:
      - "6872:6872"
    environment:
      SUPERBIZ_SQLITE_PATH: /app/data/telltale.db
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/data:/app/data
      - ../../manifest/config/config.yaml:/app/config/config.yaml:ro
