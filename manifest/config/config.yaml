# https://goframe.org/docs/web/server-config-file-template
server:
  address: ":6872"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level: "all"
  stdout: true

observability:
  enabled: false
  service_name: "sreagent"
  otlp_endpoint: "localhost:4317"
  insecure: true
  trace_sample_ratio: 1.0
  metric_interval_seconds: 15

agent:
  invoke_model_retries: 1
  failover:
    enabled: false
  tool_search:
    enabled: true
    min_tools: 8

database:
  default:
    type: "mysql"
    host: "127.0.0.1"
    port: "3306"
    user: "superbiz"
    pass: "superbiz"
    name: "superbiz_agent"

think_chat_model:
  description: "reasoning chat model for complex diagnosis"
  api_key: "YOUR_CHAT_API_KEY"
  base_url: "YOUR_CHAT_API_BASE_URL"
  model: "REASONING_CHAT_MODEL"

quick_chat_model:
  description: "fast chat model for low-latency responses"
  api_key: "YOUR_CHAT_API_KEY"
  base_url: "YOUR_CHAT_API_BASE_URL"
  model: "FAST_CHAT_MODEL"

failover_chat_model:
  description: "backup chat model used when the primary model is unavailable"
  api_key: "YOUR_FAILOVER_CHAT_API_KEY"
  base_url: "YOUR_FAILOVER_CHAT_API_BASE_URL"
  model: "FAILOVER_CHAT_MODEL"

embedding_model:
  description: "multimodal embedding model for knowledge retrieval"
  api_key: "YOUR_EMBEDDING_API_KEY"
  base_url: "YOUR_EMBEDDING_API_BASE_URL"
  model: "MULTIMODAL_EMBEDDING_MODEL"
  endpoint: "YOUR_MULTIMODAL_EMBEDDING_ENDPOINT"
  dimension: 1152

rerank:
  top_n: 3
  observe_log: true

milvus:
  address: "127.0.0.1:19530"
  db_name: "agent"
  collection: "biz_hybrid_v1"
  dense_dimension: 1152
  bm25_analyzer: "standard"

durable_memory:
  enabled: true
  extraction_timeout_seconds: 8
  min_confidence: 0.8
  duplicate_similarity: 0.90
  collection: "durable_memories_vector"

knowledge_retrieval:
  hybrid_candidates: 12
  rrf_k: 60
  cache_ttl_seconds: 120
  cache_max_entries: 256

skills:
  enabled: true
  dirs:
    - "skills"
  max_selected: 2
  max_body_chars: 6000

project_context:
  enabled: true
  path: "AGENT.md"
  max_chars: 12000

tools:
  call_timeout_seconds: 30
  mcp_registration_timeout_seconds: 30
  mysql:
    max_rows: 100
    allow_write: false
  mcp_log:
    enabled: true
    required: false
    url: "https://YOUR_MCP_HOST/mcp"
  sregym:
    enabled: false
    required: true
    register_submit: false
    api_hostname: "localhost"
    api_port: "8000"
    mcp_server_port: "9954"
    session_id: ""
    kubectl_mcp_url: ""
    prometheus_mcp_url: ""
    jaeger_mcp_url: ""
    submit_mcp_url: ""

permissions:
  enabled: true
  default_role: "viewer"
  roles:
    viewer:
      scopes:
        - "tool:docs.read"
        - "tool:time.read"
    oncall:
      scopes:
        - "tool:docs.read"
        - "tool:time.read"
        - "tool:metrics.read"
        - "tool:logs.read"
        - "tool:mysql.read"
        - "tool:payment.read"
    admin:
      scopes:
        - "tool:docs.read"
        - "tool:time.read"
        - "tool:metrics.read"
        - "tool:logs.read"
        - "tool:mysql.read"
        - "tool:mysql.write"
        - "tool:payment.read"
        - "tool:sregym"
    sregym:
      scopes:
        - "tool:docs.read"
        - "tool:time.read"
        - "tool:metrics.read"
        - "tool:logs.read"
        - "tool:sregym"

file_dir: "YOUR_KNOWLEDGE_DOCS_DIR"

mcp_url: "https://YOUR_MCP_HOST/mcp"
