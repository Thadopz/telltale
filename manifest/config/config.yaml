# https://goframe.org/docs/web/server-config-file-template
server:
  address: "127.0.0.1:6872"
  # Remote exposure has no request-level identity provider in standalone mode.
  # Keep this false unless an authenticated gateway protects the service.
  allow_remote: false
  # Loopback browser origins are allowed automatically. Add exact trusted
  # frontend origins here when the UI is hosted elsewhere.
  allowed_origins: []
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level: "all"
  stdout: true

observability:
  enabled: false
  service_name: "telltale"
  otlp_endpoint: "localhost:4317"
  insecure: true
  trace_sample_ratio: 1.0
  metric_interval_seconds: 15

runtime:
  environment: "standalone"

agent:
  invoke_model_retries: 1
  failover:
    enabled: false
  tool_search:
    enabled: true
    min_tools: 8

context:
  # Optional legacy hard cap. Leave at zero to use the model-aware budget.
  max_prompt_tokens: 0
  working_prompt_cap_tokens: 131072
  default_context_window_tokens: 32768
  default_max_output_tokens: 8192
  safety_margin_ratio: 0.10
  min_safety_margin_tokens: 2048
  prompt_overhead_tokens: 0
  compaction:
    # Zero derives the threshold from the usable model budget.
    max_tokens: 0
    trigger_ratio: 0.70
    target_ratio: 0.55
    min_recent_messages: 4
    max_summary_chars: 6000
    max_facts: 256

database:
  # Optional business-database observation targets. Telltale's own SQLite
  # state is configured separately under storage.sqlite_path.
  default_target: ""
  targets: {}

storage:
  sqlite_path: "data/telltale.db"

identity:
  user_id: "local-user"
  tenant_id: "local"
  roles:
    - "oncall"

actions:
  store: "memory"

think_chat_model:
  description: "reasoning chat model for complex diagnosis"
  api_key: "YOUR_CHAT_API_KEY"
  base_url: "YOUR_CHAT_API_BASE_URL"
  model: "REASONING_CHAT_MODEL"
  context_window_tokens: 1048576
  max_output_tokens: 8192

quick_chat_model:
  description: "fast chat model for low-latency responses"
  api_key: "YOUR_CHAT_API_KEY"
  base_url: "YOUR_CHAT_API_BASE_URL"
  model: "FAST_CHAT_MODEL"
  context_window_tokens: 1048576
  max_output_tokens: 8192

failover_chat_model:
  description: "backup chat model used when the primary model is unavailable"
  api_key: "YOUR_FAILOVER_CHAT_API_KEY"
  base_url: "YOUR_FAILOVER_CHAT_API_BASE_URL"
  model: "FAILOVER_CHAT_MODEL"
  context_window_tokens: 32768
  max_output_tokens: 8192

embedding_model:
  description: "multimodal embedding model for knowledge retrieval"
  api_key: "YOUR_EMBEDDING_API_KEY"
  base_url: "YOUR_EMBEDDING_API_BASE_URL"
  model: "MULTIMODAL_EMBEDDING_MODEL"
  endpoint: "YOUR_MULTIMODAL_EMBEDDING_ENDPOINT"
  dimension: 1152

rerank:
  top_n: 3
  observe_log: true

durable_memory:
  enabled: true
  extraction_timeout_seconds: 8
  min_confidence: 0.8
  duplicate_similarity: 0.90

knowledge_retrieval:
  hybrid_candidates: 12
  rrf_k: 60
  cache_ttl_seconds: 120
  cache_max_entries: 256

skills:
  enabled: true
  dirs:
    - "skills"
  max_selected: 2
  max_body_chars: 6000

project_context:
  enabled: true
  path: "AGENT.md"
  max_chars: 12000

code:
  enabled: false
  repositories:
    card_service:
      service_name: "card-service"
      root: ""
      revision: ""
      deployed_revision: ""
      deployment_manifest: ""
      include:
        - "cmd/**"
        - "internal/**"
        - "api/**"
        - "migrations/**"
        - "manifest/config/**"
      exclude:
        - ".git/**"
        - "vendor/**"
        - ".env*"
        - "**/*.key"
        - "**/*.pem"
        - "**/*.crt"
        - "**/*secret*"
        - "**/*credential*"
  limits:
    max_file_bytes: 1048576
    max_search_results: 8
    max_read_lines: 160
    max_read_chars: 24000
    max_handles: 64
    handle_ttl_seconds: 600
    handle_uses: 3

tools:
  call_timeout_seconds: 30
  mcp_registration_timeout_seconds: 30
  mcp_servers: []
  result_budget:
    agent_max_bytes: 65536
    agent_max_rows: 50
    hard_max_rows: 100
    cli_max_bytes: 1048576
    max_sql_text_chars: 1000
    max_observations: 32
  mysql:
    max_rows: 100
    allow_write: false
  prometheus:
    base_url: "http://127.0.0.1:9090"

watch:
  enabled: false
  interval_seconds: 60
  query_timeout_seconds: 15
  tenant_id: "default"
  environment: "local"
  rules:
    - id: "payment-success-rate"
      domain: "payment"
      collector: "payment_metric"
      service: "payment"
      metric: "payment_success_rate"
      window_minutes: 5
      value_path: "data.success_rate"
      sample_count_path: "data.total"
      operator: "lt"
      threshold: 0.98
      minimum_samples: 100
      severity: "critical"
      firing_windows: 3
      recovery_windows: 2
    - id: "payment-pending-ratio"
      domain: "payment"
      collector: "payment_status_distribution"
      service: "payment"
      window_minutes: 10
      value_path: "data.pending_ratio"
      sample_count_path: "data.total"
      operator: "gt"
      threshold: 0.10
      minimum_samples: 50
      severity: "warning"
      firing_windows: 3
      recovery_windows: 2
    - id: "active-prometheus-alerts"
      domain: "observability"
      collector: "prometheus_alerts"
      service: "prometheus"
      window_minutes: 5
      value_path: "alerts"
      operator: "count_gt"
      threshold: 0
      severity: "critical"
      firing_windows: 2
      recovery_windows: 2

permissions:
  enabled: true
  default_role: "viewer"
  roles:
    viewer:
      scopes:
        - "tool:docs.read"
        - "tool:time.read"
    oncall:
      scopes:
        - "tool:docs.read"
        - "tool:time.read"
        - "tool:metrics.read"
        - "tool:logs.read"
        - "tool:database.read"
        - "tool:payment.read"
    admin:
      scopes:
        - "tool:docs.read"
        - "tool:time.read"
        - "tool:metrics.read"
        - "tool:logs.read"
        - "tool:database.read"
        - "tool:database.write"
        - "tool:payment.read"
        - "tool:sregym"
    code_reader:
      scopes:
        - "tool:code.read"
    sregym:
      scopes:
        - "tool:docs.read"
        - "tool:time.read"
        - "tool:metrics.read"
        - "tool:logs.read"
        - "tool:sregym"

file_dir: "data/docs"

uploads:
  max_file_bytes: 4194304
